version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: integration
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors scheduled as their own upgrade (see .audit-allowlist.json).
      - dependency-name: astro
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: sharp
        update-types: ['version-update:semver-major']
      - dependency-name: '@vercel/blob'
        update-types: ['version-update:semver-major']
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: integration
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
