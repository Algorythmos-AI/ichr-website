version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: integration
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Framework majors are upgraded deliberately, with preview verification — not by bot.
      - dependency-name: astro
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: sharp
        update-types: ['version-update:semver-major']
      - dependency-name: '@vercel/blob'
        update-types: ['version-update:semver-major']
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # The compiler major (TypeScript 7, the native port) needs Astro tooling support first.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # ESLint majors move together (eslint, @eslint/js, typescript-eslint, plugins); take them as
      # one deliberate upgrade, not piecemeal (#15 and #17 each failed alone).
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-*'
        update-types: ['version-update:semver-major']
      # Types must match the oldest Node the code runs on (22 locally, 24 in production);
      # newer majors would type-check APIs that do not exist at runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: integration
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
