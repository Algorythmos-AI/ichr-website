name: Bug report
description: Something on the site is broken or wrong.
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://www.ichr-international.org/...
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Language
      multiple: true
      options: [English, Arabic, French]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Device and browser
