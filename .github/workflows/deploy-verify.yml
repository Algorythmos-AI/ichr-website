name: deploy-verify

# Smoke-tests every Vercel PREVIEW deployment (production is verified by release.yml).
#
# Previews sit behind Vercel Deployment Protection (a redirect to the Vercel login). To test
# them, create a Protection Bypass for Automation secret in Vercel (Project → Settings →
# Deployment Protection) and store it as the repository secret
# VERCEL_AUTOMATION_BYPASS_SECRET. Without it this job posts a notice and passes, rather than
# failing on the login redirect.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      github.event.deployment_status.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Smoke-test the preview
        env:
          URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::Preview $URL is behind Vercel Deployment Protection and VERCEL_AUTOMATION_BYPASS_SECRET is not set; skipping."
            exit 0
          fi
          node scripts/ci/smoke.mjs "$URL"
